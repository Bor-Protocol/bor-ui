<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heaven Scene</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(180deg, 
                #E6E6FA 0%, 
                #FFF0F5 30%, 
                #FAFAD2 60%, 
                #FFE4B5 100%);
            position: relative;
            height: 100vh;
        }

        /* Animated clouds */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
            animation: float 20s infinite ease-in-out;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.5);
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 20%;
            left: -100px;
            animation: drift 30s infinite linear;
        }

        .cloud1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1::after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 80px;
            height: 35px;
            top: 40%;
            left: -80px;
            animation: drift 40s infinite linear;
        }

        .cloud2::before {
            width: 60px;
            height: 40px;
            top: -20px;
            left: 15px;
        }

        .cloud2::after {
            width: 50px;
            height: 35px;
            top: -10px;
            right: 15px;
        }

        .cloud3 {
            width: 120px;
            height: 45px;
            top: 60%;
            left: -120px;
            animation: drift 35s infinite linear;
        }

        .cloud3::before {
            width: 70px;
            height: 50px;
            top: -20px;
            left: 20px;
        }

        .cloud3::after {
            width: 65px;
            height: 40px;
            top: -15px;
            right: 20px;
        }

        @keyframes drift {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(100vw + 200px));
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Golden Gates */
        .gates-container {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            perspective: 1000px;
        }

        .gate {
            width: 120px;
            height: 200px;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
            border: 3px solid #FFD700;
            border-radius: 80px 80px 0 0;
            position: relative;
            display: inline-block;
            margin: 0 5px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            animation: glow 3s ease-in-out infinite;
            transform-origin: bottom;
        }

        .gate-left {
            animation: openLeft 8s ease-in-out infinite;
        }

        .gate-right {
            animation: openRight 8s ease-in-out infinite;
        }

        @keyframes openLeft {
            0%, 100% {
                transform: rotateY(0deg);
            }
            50% {
                transform: rotateY(-25deg);
            }
        }

        @keyframes openRight {
            0%, 100% {
                transform: rotateY(0deg);
            }
            50% {
                transform: rotateY(25deg);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            }
            50% {
                box-shadow: 0 0 50px rgba(255, 215, 0, 0.9);
            }
        }

        /* Gate details */
        .gate-pattern {
            position: absolute;
            width: 90%;
            height: 90%;
            top: 5%;
            left: 5%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 70px 70px 0 0;
        }

        /* Stars */
        .star {
            position: absolute;
            background: white;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%,
                79% 91%, 50% 70%, 21% 91%, 32% 57%,
                2% 35%, 39% 35%
            );
            animation: twinkle 3s ease-in-out infinite;
        }

        .star1 {
            width: 20px;
            height: 20px;
            top: 10%;
            left: 15%;
            animation-delay: 0s;
        }

        .star2 {
            width: 15px;
            height: 15px;
            top: 15%;
            right: 20%;
            animation-delay: 1s;
        }

        .star3 {
            width: 25px;
            height: 25px;
            top: 25%;
            left: 40%;
            animation-delay: 2s;
        }

        .star4 {
            width: 18px;
            height: 18px;
            top: 8%;
            right: 35%;
            animation-delay: 0.5s;
        }

        .star5 {
            width: 22px;
            height: 22px;
            top: 30%;
            right: 15%;
            animation-delay: 1.5s;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Light rays */
        .light-rays {
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            opacity: 0.3;
        }

        .ray {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 400px;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.8) 50%, 
                transparent 100%);
            transform-origin: top center;
            animation: rotateRay 20s linear infinite;
        }

        .ray:nth-child(1) { transform: rotate(0deg); }
        .ray:nth-child(2) { transform: rotate(30deg); }
        .ray:nth-child(3) { transform: rotate(60deg); }
        .ray:nth-child(4) { transform: rotate(90deg); }
        .ray:nth-child(5) { transform: rotate(120deg); }
        .ray:nth-child(6) { transform: rotate(150deg); }

        @keyframes rotateRay {
            0% {
                transform: rotate(0deg) scaleY(0.5);
                opacity: 0.2;
            }
            50% {
                transform: rotate(180deg) scaleY(1);
                opacity: 0.4;
            }
            100% {
                transform: rotate(360deg) scaleY(0.5);
                opacity: 0.2;
            }
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.9), 
                rgba(255, 215, 0, 0.6));
            animation: floatOrb 10s ease-in-out infinite;
        }

        .orb1 {
            width: 30px;
            height: 30px;
            top: 70%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb2 {
            width: 25px;
            height: 25px;
            top: 75%;
            right: 15%;
            animation-delay: 2s;
        }

        .orb3 {
            width: 35px;
            height: 35px;
            top: 65%;
            left: 70%;
            animation-delay: 4s;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0.6;
            }
            25% {
                transform: translateY(-30px) translateX(10px);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-50px) translateX(-10px);
                opacity: 1;
            }
            75% {
                transform: translateY(-30px) translateX(5px);
                opacity: 0.8;
            }
        }

        /* Hover effect on gates */
        .gate:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }

        /* Title */
        .title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Georgia', serif;
            font-size: 3em;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: fadeIn 3s ease-in;
            letter-spacing: 5px;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Light rays -->
    <div class="light-rays">
        <div class="ray"></div>
        <div class="ray"></div>
        <div class="ray"></div>
        <div class="ray"></div>
        <div class="ray"></div>
        <div class="ray"></div>
    </div>

    <!-- Stars -->
    <div class="star star1"></div>
    <div class="star star2"></div>
    <div class="star star3"></div>
    <div class="star star4"></div>
    <div class="star star5"></div>

    <!-- Clouds -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <!-- Floating orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <script>
        // Add more stars dynamically
        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 15 + 10 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 40 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(star);
        }

        // Create additional stars
        for (let i = 0; i < 15; i++) {
            createStar();
        }

        // Add sparkle effect on mouse move
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.95) {
                const sparkle = document.createElement('div');
                sparkle.style.position = 'absolute';
                sparkle.style.width = '4px';
                sparkle.style.height = '4px';
                sparkle.style.backgroundColor = 'white';
                sparkle.style.borderRadius = '50%';
                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';
                sparkle.style.pointerEvents = 'none';
                sparkle.style.animation = 'sparkle 1s ease-out forwards';
                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 1000);
            }
        });

        // Add sparkle animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes sparkle {
                0% {
                    transform: scale(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: scale(1.5) rotate(180deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
